name: FactVerse Auto Upload
on:
  schedule:
    - cron: '0 6 * * *'
    - cron: '0 14 * * *'
    - cron: '0 22 * * *'
  workflow_dispatch:
jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Create token file
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          python -c "import os; open('token.json','w', encoding='utf-8').write(os.environ['YOUTUBE_TOKEN_JSON'])"
          echo "Token file created, size:"
          wc -c token.json
      - name: Run Bot
        run: python main.py
